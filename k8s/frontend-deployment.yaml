apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: smartpay

spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend

          image: 130128695612.dkr.ecr.ap-south-1.amazonaws.com/smartpay-app-frontend:latest

          imagePullPolicy: Always

          ports:
            - containerPort: 80

          env:
            - name: BACKEND_URL
              value: "http://backend-service:5000"