apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: smartpay

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      restartPolicy: Always

      containers:
        - name: backend

          image: 130128695612.dkr.ecr.ap-south-1.amazonaws.com/smartpay-app-backend:latest

          imagePullPolicy: Always

          ports:
            - containerPort: 5000

          env:
            - name: MYSQL_HOST
              value: "smartpay-mysql-rds.c3yc888c4lqk.ap-south-1.rds.amazonaws.com"

            - name: MYSQL_USER
              value: "admin"

            - name: MYSQL_PASSWORD
              value: "Smartpay123"

            - name: MYSQL_DATABASE
              value: "smartpaydb"

          readinessProbe:
            httpGet:
              path: /transactions
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /transactions
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 10