apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: smartpay

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      restartPolicy: Always

      containers:
        - name: backend

          image: 130128695612.dkr.ecr.ap-south-1.amazonaws.com/smartpay-app-backend:latest

          imagePullPolicy: Always

          ports:
            - containerPort: 5000

          env:
            - name: MYSQL_HOST
              valueFrom:
                secretKeyRef:
                  name: smartpay-secret
                  key: DB_HOST

            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: smartpay-secret
                  key: DB_USER

            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smartpay-secret
                  key: DB_PASSWORD

            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: smartpay-secret
                  key: DB_NAME

          