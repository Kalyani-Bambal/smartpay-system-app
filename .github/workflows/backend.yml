name: Backend CI/CD

on:
  push:
    branches:
      - main

jobs:
  backend-deploy:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-south-1

    - name: Login ECR
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build Backend Image
      run: |
        docker build -t smartpay-backend ./backend

    - name: Tag Image
      run: |
        docker tag smartpay-backend:latest \
        130128695612.dkr.ecr.ap-south-1.amazonaws.com/smartpay-backend:latest

    - name: Push Image
      run: |
        docker push \
        130128695612.dkr.ecr.ap-south-1.amazonaws.com/smartpay-backend:latest

    - name: Configure Kubectl
      run: |
        aws eks update-kubeconfig \
        --region ap-south-1 \
        --name smartpay-cluster

    - name: Deploy
      run: |
        kubectl apply -f k8s/backend/